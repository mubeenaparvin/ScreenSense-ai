<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - ScreenSense AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #3b0a16 0%,
                    #641225 45%,
                    #8f2d45 75%,
                    #b14a62 100%
                );

            padding: 20px;
        }

        .login-container {
            width: 400px;
            background: rgba(255, 255, 255, 0.98);
            padding: 42px;
            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(45, 5, 15, 0.35);

            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #5a0f20,
                    #8f2d45,
                    #b14a62
                );

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 8px;
        }

        .admin-title {
            text-align: center;
            color: #64748b;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #cbd5e1;
            border-radius: 9px;

            font-size: 15px;
            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #8f2d45;

            box-shadow:
                0 0 0 3px rgba(143, 45, 69, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #4b0b1a,
                    #74152c,
                    #9b344d
                );

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
            margin-top: 5px;

            box-shadow:
                0 7px 18px rgba(116, 21, 44, 0.25);

            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);

            background:
                linear-gradient(
                    135deg,
                    #3b0a16,
                    #641225,
                    #8f2d45
                );
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;

            padding: 10px;
            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;
            font-size: 14px;
        }

        .back-link {
            text-align: center;
            margin-top: 22px;
        }

        .back-link a {
            color: #74152c;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-link a:hover {
            color: #4b0b1a;
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            .login-container {
                width: 100%;
                padding: 30px 25px;
            }

            .logo {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            🧠 ScreenSense AI
        </div>

        <div class="admin-title">
            Administrator Login
        </div>

        {% if message %}
            <div class="error">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST" action="/admin/login">

            <div class="form-group">

                <label for="email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>

            <button type="submit" class="login-btn">
                Login as Admin
            </button>

        </form>

        <div class="back-link">

            <a href="/login">
                ← Back to User Login
            </a>

        </div>

    </div>

</body>
</html>
