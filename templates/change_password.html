<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password - ScreenSense AI</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: #f8f1f3;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 420px;
        background: #ffffff;
        padding: 42px;
        border-radius: 16px;
        border: 1px solid #ead6db;
        box-shadow: 0 12px 35px rgba(100, 19, 51, 0.12);
    }

    .logo {
        text-align: center;
        color: #641333;
        font-size: 27px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #7a6870;
        font-size: 14px;
        margin-bottom: 28px;
    }

    .line {
        width: 45px;
        height: 3px;
        background: #8b3046;
        border-radius: 5px;
        margin: 0 auto 24px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #3f2931;
    }

    input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d8c4ca;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    input:focus {
        border-color: #8b3046;
        box-shadow: 0 0 0 3px rgba(139, 48, 70, 0.10);
    }

    .change-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #641333;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 5px;
    }

    .change-btn:hover {
        background: #4f0f28;
    }

    .error {
        background: #fbe8eb;
        color: #a61b36;
        border: 1px solid #f0c4cc;
        padding: 11px;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
        margin-bottom: 20px;
    }

    .success {
        background: #edf7f0;
        color: #287044;
        border: 1px solid #c8e5d0;
        padding: 11px;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
        margin-bottom: 20px;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 22px;
        color: #641333;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
    }

    .back-link:hover {
        text-decoration: underline;
    }

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        🧠 ScreenSense AI
    </div>

    <div class="line"></div>

    <div class="subtitle">
        Change your account password
    </div>

    {% if message %}
        <div class="error">
            {{ message }}
        </div>
    {% endif %}

    {% if success %}
        <div class="success">
            {{ success }}
        </div>
    {% endif %}

    <form method="POST">

        <div class="form-group">

            <label for="current_password">
                Current Password
            </label>

            <input
                type="password"
                id="current_password"
                name="current_password"
                placeholder="Enter your current password"
                required
            >

        </div>

        <div class="form-group">

            <label for="new_password">
                New Password
            </label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter your new password"
                required
            >

        </div>

        <div class="form-group">

            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm your new password"
                required
            >

        </div>

        <button type="submit" class="change-btn">
            Change Password
        </button>

    </form>

    <a href="{{ url_for('settings') }}" class="back-link">
        ← Back to Settings
    </a>

</div>

</body>
</html>
